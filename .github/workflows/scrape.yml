      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use the workflow's branch name; replace 'main' if your default branch is different.
          BRANCH="${{ github.ref_name || 'main' }}"

          # Fetch and rebase onto the latest remote branch to avoid non-fast-forward pushes.
          git fetch origin "$BRANCH"
          git pull --rebase --autostash origin "$BRANCH" || true

          git add content
          git diff --cached --quiet || git commit -m "Update scraped content"
          git push
