name: Scrape with Firecrawl

on:
  workflow_dispatch:

# Tighten permissions: only the scrape job may write to the repository.
# The workflow level stays empty so checkout and other steps get read-only tokens.
permissions: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Scrape
        run: python scrape.py
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Verify content
        run: |
          test -f content/log.txt
          test $(find content -name "*.md" | wc -l) -gt 0

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Update scraped content"
          git fetch origin main
          git rebase origin/main
          git push
